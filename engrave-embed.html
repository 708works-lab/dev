
<!-- 名入れ刻印シミュレーター（プロトタイプ／Phase 1） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Special+Elite&family=Lobster&family=Playball&family=Great+Vibes&family=Bebas+Neue&family=UnifrakturMaguntia&display=swap">
<link rel="stylesheet" href="./engrave-simulator.css">

<div class="engrave-simulator">
  <div class="proto-badge">試作版（Phase 1）— 実際の刻印箇所画像は未反映です</div>
  <header>
    <h1>ENGRAVE SIMULATOR</h1>
    <p>刻印する文字とフォントを選んで、仕上がりイメージを確認できます</p>
  </header>

  <div class="app">
    <div class="preview-box">
      <div class="pv-caption">仕上がりイメージ（試作背景）</div>
      <canvas id="eg-canvas" width="600" height="300"></canvas>
    </div>

    <div class="field-label">刻印する文字（半角英数字）</div>
    <input type="text" id="eg-text" maxlength="25" placeholder="例：Sample 0123">
    <div class="char-count" id="eg-char-count">0 / 15</div>
    <div class="warn-msg" id="eg-warn"></div>

    <div class="field-label">フォントを選択</div>
    <select class="font-select" id="eg-font-select"></select>
    <div class="font-preview" id="eg-font-preview"></div>

    <div class="notice-box">
      <strong>ご注意</strong><br>
      こちらはあくまで仕上がりイメージの確認用です。実際の刻印は、バランスを見て文字サイズや余白を弊社側で調整する場合があります。文字数や書体によっては、見栄えを考慮して2段配置に変更することもあります。あらかじめご了承ください。
    </div>

    <div class="bottom-bar">
      <button class="btn-save" id="eg-save-btn">画像を保存する</button>
    </div>
  </div>
</div>

<script src="./engrave-simulator.js"></script>
