<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Folklore Color Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;background:#f0ede8;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;}
body{display:flex;flex-direction:column;align-items:center;}
header{width:100%;background:#111;color:#fff;text-align:center;padding:10px 16px 7px;flex-shrink:0;}
header h1{font-size:15px;letter-spacing:.25em;font-weight:400;}
header p{font-size:11px;color:#666;letter-spacing:.15em;margin-top:1px;}
.app{width:100%;max-width:520px;display:flex;flex-direction:column;}
.top-area{display:flex;flex-direction:row;padding:10px 10px 0;gap:10px;align-items:stretch;}
.ctrl-col{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;}
.strap-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:130px;}
.dir-tag{width:100%;text-align:center;padding:6px 4px;border-radius:8px;background:#333;color:#fff;font-size:11px;font-weight:500;line-height:1.3;}
.dir-tag small{display:block;font-size:9px;color:#aaa;font-weight:400;margin-top:1px;}
.strap-scroll{width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 0;}
.strap-scroll::-webkit-scrollbar{display:none;}
.count-row{display:flex;align-items:center;gap:5px;background:#fff;border-radius:12px;padding:6px 8px;}
.cnt-btn{width:34px;height:34px;border:1px solid #ddd;border-radius:50%;background:#fff;font-size:20px;color:#555;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cnt-btn:active{background:#111;color:#fff;border-color:#111;}
.cnt-num{font-size:15px;font-weight:600;color:#111;text-align:center;}
.cnt-sub{font-size:11px;color:#aaa;margin-top:2px;text-align:center;}
.sel-box{background:#fff;border-radius:12px;padding:8px 12px;}
.box-label{font-size:11px;color:#aaa;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;}
.sel-info{font-size:13px;color:#444;line-height:1.4;}
.sel-info b{color:#111;}
.mode-row{display:flex;gap:4px;}
.mbt{flex:1;padding:9px 2px;border:1px solid #e0e0e0;border-radius:7px;background:#fff;font-size:11px;color:#888;cursor:pointer;transition:all .12s;}
.mbt.on{background:#111;color:#fff;border-color:#111;}

/* カラーパレット：横並び（丸＋名前） */
.pal-box{background:#fff;border-radius:12px;padding:10px 12px;}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.cb-wrap{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:10px;cursor:pointer;min-width:0;}
.cb-wrap:active{background:#f0ede8;}
.cb{width:32px;height:32px;flex-shrink:0;border-radius:50%;border:3px solid transparent;pointer-events:none;}
.cb.on{border-color:#111;box-shadow:0 0 0 2px #fff inset;}
.color-name{font-size:12px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;min-width:0;flex:1;}
.color-name.on{font-weight:600;color:#111;}
/* 幅が狭いとき：色名を非表示にして丸を4列に */
@media (max-width:360px){
  .palette{grid-template-columns:repeat(4,1fr);gap:6px;}
  .cb-wrap{justify-content:center;gap:0;padding:6px 2px;}
  .cb{width:36px;height:36px;}
  .color-name{display:none;}
}
@media (min-width:361px) and (max-width:400px){
  .cb{width:28px;height:28px;}
  .color-name{font-size:10px;}
  .cb-wrap{gap:6px;padding:5px 4px;}
}

.grad-box{background:#fff;border-radius:12px;padding:10px 12px;}
.grad-note{font-size:10px;color:#c0392b;margin-bottom:7px;line-height:1.5;}
.grad-row{display:flex;gap:6px;flex-wrap:wrap;}
.gb{padding:7px 11px;border-radius:10px;border:1px solid #e0e0e0;background:#fff;font-size:11px;cursor:pointer;color:#666;white-space:nowrap;}
.gb:active{background:#111;color:#fff;}
.sum-box{background:#fff;border-radius:12px;padding:10px 12px;}
.summary{font-size:11px;color:#666;line-height:2;display:flex;flex-wrap:wrap;gap:1px 8px;}
.si{display:flex;align-items:center;gap:4px;}
.sw{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex-shrink:0;}
.share-area{width:100%;max-width:520px;padding:10px 10px 0;}
.sbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:11px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;font-size:12px;color:#444;}
.sbtn:active{background:#111;color:#fff;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:8px 18px;border-radius:20px;font-size:11px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:999;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.bottom-bar{width:100%;max-width:520px;padding:8px 10px 24px;display:flex;gap:6px;margin-top:10px;}
.btn-reset{flex:1;padding:14px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:13px;color:#666;cursor:pointer;}
.btn-undo{flex:1;padding:14px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:13px;color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
.btn-undo:disabled{opacity:.35;cursor:default;}
.btn-order{flex:2.5;padding:14px;border:none;border-radius:10px;background:#111;color:#fff;font-size:13px;cursor:pointer;font-weight:500;letter-spacing:.04em;position:relative;}
.btn-order:active{opacity:.7;}
.btn-order:disabled{opacity:.5;cursor:not-allowed;}
.price-display{font-size:10px;color:#fff;opacity:.8;margin-top:2px;}

/* 確認モーダル */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s;}
.modal.show{display:flex;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-content{background:#fff;border-radius:16px;padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .3s;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-header h2{font-size:18px;margin:0;}
.modal-close{background:none;border:none;font-size:24px;color:#999;cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{color:#333;}
.modal-image{width:100%;border-radius:8px;margin-bottom:16px;}
.modal-info{font-size:14px;color:#666;line-height:1.8;}
.modal-info strong{color:#111;font-weight:600;}
.modal-buttons{display:flex;gap:8px;margin-top:20px;}
.modal-btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:500;}
.modal-btn-secondary{background:#f0f0f0;color:#666;}
.modal-btn-primary{background:#111;color:#fff;}
.modal-btn:active{opacity:.7;}

/* ローディングオーバーレイ */
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:none;align-items:center;justify-content:center;}
.loading-overlay.show{display:flex;}
.loading-content{background:#fff;border-radius:16px;padding:32px;text-align:center;}
.loading-spinner{width:40px;height:40px;border:4px solid #f0f0f0;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:#666;}
</style>
</head>
<body>
<header>
  <h1>FOLKLORE</h1>
  <p>COLOR SIMULATOR &nbsp;|&nbsp; 708works</p>
</header>
<div class="app">
  <div class="top-area">
    <div class="ctrl-col">
      <div class="count-row">
        <button class="cnt-btn" onclick="changeCount(-1)">−</button>
        <div style="flex:1;">
          <div class="cnt-num" id="cnt-disp">20個</div>
          <div class="cnt-sub" id="cnt-sub">標準（全長 約1150mm）</div>
        </div>
        <button class="cnt-btn" onclick="changeCount(+1)">＋</button>
      </div>
      <div class="sel-box">
        <div class="box-label">選択中</div>
        <div class="sel-info" id="sel-info">パーツをタップ</div>
      </div>
      <div class="mode-row">
        <button class="mbt on" id="m-single" onclick="setMode('single')">1枚ずつ</button>
        <button class="mbt" id="m-all"    onclick="setMode('all')">一括</button>
        <button class="mbt" id="m-range"  onclick="setMode('range')">範囲</button>
      </div>
      <div class="pal-box">
        <div class="box-label">カラー</div>
        <div class="palette" id="palette"></div>
      </div>
      <div class="grad-box">
        <div class="box-label">おすすめ配色</div>
        <div class="grad-note">※ タップすると全色変更になりますのでご注意ください</div>
        <div class="grad-row" id="grad-row"></div>
      </div>
      <div class="sum-box">
        <div class="box-label">カラーサマリー</div>
        <div class="summary" id="summary"></div>
      </div>
    </div>
    <div class="strap-col" id="strap-col">
      <div class="dir-tag">後ろ<small>エンドピン側</small></div>
      <div class="strap-scroll" id="strap-scroll"></div>
      <div class="dir-tag">前<small>ボディ上部側</small></div>
    </div>
  </div>
  <div class="share-area">
    <button class="sbtn" onclick="saveImage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      画像を保存する
    </button>
  </div>
  <div class="bottom-bar">
    <button class="btn-reset" onclick="resetAll()">リセット</button>
    <button class="btn-undo" id="btn-undo" onclick="undo()" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M3 7v6h6"/><path d="M3 13C5 7 10 3 16 3a9 9 0 0 1 0 18H8"/>
      </svg>戻る
    </button>
    <button class="btn-order" id="btn-order" onclick="goOrder()">
      この配色でカートに入れる →
      <div class="price-display" id="price-display"></div>
    </button>
  </div>
</div>

<!-- 確認モーダル -->
<div class="modal" id="confirm-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>オーダー内容確認</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <img class="modal-image" id="modal-image" src="" alt="オーダー画像">
    <div class="modal-info" id="modal-info"></div>
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-secondary" onclick="closeModal()">閉じる</button>
      <button class="modal-btn modal-btn-primary" onclick="proceedToCart()">カートへ進む</button>
    </div>
  </div>
</div>

<!-- ローディングオーバーレイ -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">処理中...</div>
  </div>
</div>

<div id="toast"></div>
<canvas id="save-canvas" style="display:none;"></canvas>

<script>
// ============================================================================
// 設定
// ============================================================================

// Cloudflare Worker URL（あなたのWorker URLに置き換えてください）
const WORKER_URL = 'https://folklore-image-upload.あなたのサブドメイン.workers.dev';

// Shopify設定
const SHOPIFY_DOMAIN = 'shop.708works.jp';

// ウロコ数とVariant IDのマッピング
const VARIANT_MAP = {
  10: '48782492270842',
  11: '48782492303610',
  12: '48782492336378',
  13: '48782492369146',
  14: '48782492401914',
  15: '48782492434682',
  16: '48782492467450',
  17: '48782492500218',
  18: '48782492532986',
  19: '48782492565754',
  20: '48782492598522',
  21: '48782492631290',
  22: '48782492664058',
  23: '48782492696826',
  24: '48782492729594',
  25: '48782492762362',
  26: '48782492795130',
  27: '48782492827898',
  28: '48782492860666',
  29: '48782492893434',
  30: '48782492926202',
};

// 価格マップ
const PRICE_MAP = {
  10: 13640, 11: 15004, 12: 16368, 13: 17732, 14: 19096,
  15: 20460, 16: 21824, 17: 23188, 18: 24552, 19: 25916,
  20: 27280, 21: 28644, 22: 30008, 23: 31372, 24: 32736,
  25: 34100, 26: 35464, 27: 36828, 28: 38192, 29: 39556,
  30: 40920,
};

// カラー定義
const COLORS=[
  {id:'white',   name:'White',     hex:'#f2f0ec'},
  {id:'yellow',  name:'Yellow',    hex:'#e8c84a'},
  {id:'lgrn',    name:'Light GRN', hex:'#a8c43a'},
  {id:'lbl',     name:'Light BL',  hex:'#7baed0'},
  {id:'orange',  name:'Orange',    hex:'#e04e1a'},
  {id:'sakura',  name:'Sakura',    hex:'#f0a0a8'},
  {id:'pink',    name:'Pink',      hex:'#d96090'},
  {id:'red',     name:'Red',       hex:'#b82828'},
  {id:'winered', name:'Wine Red',  hex:'#7a2035'},
  {id:'navy',    name:'Navy',      hex:'#1e2540'},
  {id:'natural', name:'Natural',   hex:'#e8c4a0'},
  {id:'tan',     name:'Tan',       hex:'#d4742a'},
  {id:'camel',   name:'Camel',     hex:'#c46030'},
  {id:'brown',   name:'Brown',     hex:'#9e3820'},
  {id:'choco',   name:'Choco',     hex:'#4a2018'},
  {id:'grey',    name:'Grey',      hex:'#9090a0'},
  {id:'olive',   name:'Olive',     hex:'#7a7848'},
  {id:'green',   name:'Green',     hex:'#3a5030'},
  {id:'greenbl', name:'Green Blue',hex:'#2a5060'},
  {id:'black',   name:'Black',     hex:'#1a1a1a'},
];

const GRADS=[
  {name:'オーシャン', fn:i=>['#1e2540','#2a5060','#7baed0','#3a5030','#2a5060','#1e2540'][i%6]},
  {name:'サンセット', fn:i=>['#1a1a1a','#7a2035','#b82828','#d4742a','#e8c84a','#d4742a'][i%6]},
  {name:'フォレスト', fn:i=>['#1a1a1a','#3a5030','#7a7848','#a8c43a','#3a5030','#1a1a1a'][i%6]},
  {name:'ヴィンテージ',fn:i=>['#4a2018','#9e3820','#c46030','#d4742a','#e8c4a0','#c46030'][i%6]},
  {name:'キャンディ', fn:i=>['#d96090','#f0a0a8','#e8c84a','#7baed0','#a8c43a','#d96090'][i%6]},
];

// ============================================================================
// グローバル変数
// ============================================================================

let N=20, partColors=Array(N).fill('#c46030');
let selected=new Set(), mode='single', rangeStart=null;
let activeColor=COLORS[12];
let history=[];
let lastUploadedImage = null;
const PW=40,PH=50,OVL=16,PAD=6,LABEL_W=72;

// ============================================================================
// 初期化
// ============================================================================

window.addEventListener('load',()=>{
  buildPalette();
  buildGrads();
  updateSummary();
  buildStrapRows();
  updatePriceDisplay();
});

window.addEventListener('resize',()=>buildStrapRows());

// ============================================================================
// 価格表示
// ============================================================================

function updatePriceDisplay(){
  const price = PRICE_MAP[N];
  document.getElementById('price-display').textContent = `¥${price.toLocaleString()}（税込）`;
}

// ============================================================================
// 履歴管理
// ============================================================================

function saveHistory(){
  history.push({colors:[...partColors],n:N});
  if(history.length>30) history.shift();
  document.getElementById('btn-undo').disabled=false;
}

function undo(){
  if(!history.length)return;
  const prev=history.pop();
  N=prev.n; partColors=prev.colors;
  selected.clear();
  updateCountDisplay();
  updatePriceDisplay();
  document.getElementById('sel-info').textContent='パーツをタップ';
  buildStrapRows(); updateSummary();
  if(!history.length) document.getElementById('btn-undo').disabled=true;
}

// ============================================================================
// カウント表示
// ============================================================================

function updateCountDisplay(){
  document.getElementById('cnt-disp').textContent=N+'個';
  const diff=N-20, len=1150+diff*60;
  const txt=diff===0?'標準':diff>0?`標準より${diff}個多い`:`標準より${Math.abs(diff)}個少ない`;
  document.getElementById('cnt-sub').textContent=`${txt}（全長 約${len}mm）`;
}

function changeCount(d){
  const nx=N+d; if(nx<10||nx>30)return;
  saveHistory(); N=nx;
  if(d>0) for(let k=0;k<d;k++) partColors.push('#c46030');
  else partColors=partColors.slice(0,N);
  selected.clear();
  document.getElementById('sel-info').textContent='パーツをタップ';
  updateCountDisplay();
  updatePriceDisplay();
  buildStrapRows();
  updateSummary();
}

// ============================================================================
// ストラップ描画
// ============================================================================

function buildStrapRows(){
  const scroll=document.getElementById('strap-scroll');
  const col=document.getElementById('strap-col');
  col.style.width=(PW+10+LABEL_W)+'px';
  scroll.innerHTML='';
  const totalH=PAD+N*PH-(N-1)*OVL+PAD;
  const wrap=document.createElement('div');
  wrap.style.cssText=`position:relative;width:${PW+10+LABEL_W}px;height:${totalH}px;`;
  const dpr=window.devicePixelRatio||1;
  for(let i=0;i<N;i++){
    const y=PAD+i*(PH-OVL);
    const frontNum=N-i;
    const cv=document.createElement('canvas');
    cv.width=(PW+10)*dpr; cv.height=PH*dpr;
    cv.style.cssText=`position:absolute;left:0;top:${y}px;width:${PW+10}px;height:${PH}px;cursor:pointer;background:transparent;`;
    cv.dataset.idx=i;
    cv.addEventListener('click',()=>handleTap(i));
    cv.addEventListener('touchend',e=>{e.preventDefault();handleTap(i);},{passive:false});
    const ctx=cv.getContext('2d');
    ctx.scale(dpr,dpr);
    drawDrop(ctx,(PW+10)/2,0,partColors[i],selected.has(i),frontNum===3?'ロゴ刻印':null,i===0,i===N-1);
    const lbl=document.createElement('div');
    lbl.id=`lbl-${i}`;
    lbl.style.cssText=`position:absolute;left:${PW+14}px;top:${y+PH*0.46}px;transform:translateY(-50%);font-size:9px;white-space:nowrap;pointer-events:none;line-height:1.3;`;
    const cname=COLORS.find(c=>c.hex===partColors[i])?.name||'';
    lbl.innerHTML=`<span style="font-size:8px;color:#bbb;">P${frontNum}</span><br><span style="color:${selected.has(i)?'#111':'#666'};font-weight:${selected.has(i)?600:400};">${cname}</span>`;
    wrap.appendChild(cv); wrap.appendChild(lbl);
  }
  scroll.appendChild(wrap);
}

function redrawAll(){
  const dpr=window.devicePixelRatio||1;
  for(let i=0;i<N;i++){
    const cv=document.querySelector(`canvas[data-idx="${i}"]`);
    if(!cv)continue;
    const ctx=cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,PW+10,PH);
    const frontNum=N-i;
    drawDrop(ctx,(PW+10)/2,0,partColors[i],selected.has(i),frontNum===3?'ロゴ刻印':null,i===0,i===N-1);
    const lbl=document.getElementById(`lbl-${i}`);
    if(lbl){
      const cname=COLORS.find(c=>c.hex===partColors[i])?.name||'';
      lbl.innerHTML=`<span style="font-size:8px;color:#bbb;">P${frontNum}</span><br><span style="color:${selected.has(i)?'#111':'#666'};font-weight:${selected.has(i)?600:400};">${cname}</span>`;
    }
  }
}

function drawDrop(ctx,cx,y,color,isSel,badge,isEndPin,isBodyPin){
  const hw=PW/2,top=y,bot=y+PH;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx,top+1);
  ctx.bezierCurveTo(cx+hw*.55,top+PH*.12,cx+hw,top+PH*.45,cx+hw,bot-hw*.85);
  ctx.bezierCurveTo(cx+hw,bot,cx-hw,bot,cx-hw,bot-hw*.85);
  ctx.bezierCurveTo(cx-hw,top+PH*.45,cx-hw*.55,top+PH*.12,cx,top+1);
  ctx.closePath();
  ctx.fillStyle=color; ctx.fill();
  const g=ctx.createLinearGradient(cx,top,cx,bot);
  g.addColorStop(0,'rgba(255,255,255,.22)');
  g.addColorStop(.4,'rgba(255,255,255,.06)');
  g.addColorStop(1,'rgba(0,0,0,.15)');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=isSel?'rgba(255,215,0,.95)':'rgba(0,0,0,.4)';
  ctx.lineWidth=isSel?2.2:.7; ctx.stroke();
  if(isEndPin){
    ctx.save();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(cx,top+hw*.52,hw*.20,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,1)'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx,top+hw*.52,hw*.20,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=.7; ctx.stroke();
  }
  if(isBodyPin){
    ctx.save();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(cx,bot-hw*.52,hw*.20,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,1)'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx,bot-hw*.52,hw*.20,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=.7; ctx.stroke();
  }
  if(badge){
    ctx.fillStyle='rgba(255,255,255,.80)';
    ctx.font=`bold ${Math.max(5,PH*.11)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(badge,cx,top+PH*.58);
  }
  ctx.restore();
}

// タップ処理
// ============================================================================

function handleTap(i){
  if(mode==='single'){
    saveHistory();
    selected.clear(); selected.add(i);
    partColors[i]=activeColor.hex; updateSummary();
  }else if(mode==='range'){
    if(rangeStart===null){rangeStart=i;selected.clear();selected.add(i);}
    else{
      saveHistory();
      const a=Math.min(rangeStart,i),b=Math.max(rangeStart,i);
      selected.clear(); for(let j=a;j<=b;j++) selected.add(j);
      rangeStart=null;
    }
  }
  updateSelInfo(); redrawAll();
}

// ============================================================================
// モード切替
// ============================================================================

function setMode(m){
  mode=m; rangeStart=null;
  document.querySelectorAll('.mbt').forEach(b=>b.classList.remove('on'));
  document.getElementById('m-'+m).classList.add('on');
  if(m==='all'){
    selected.clear(); for(let i=0;i<N;i++) selected.add(i);
    document.getElementById('sel-info').innerHTML=`全 <b>${N}枚</b>`;
  }else{
    selected.clear();
    document.getElementById('sel-info').textContent='パーツをタップ';
  }
  redrawAll();
}

function updateSelInfo(){
  const el=document.getElementById('sel-info');
  if(!selected.size){el.textContent='パーツをタップ';return;}
  const arr=[...selected].sort((a,b)=>a-b);
  const front=i=>N-i;
  if(arr.length===1) el.innerHTML=`前から <b>#${front(arr[0])}</b>`;
  else el.innerHTML=`前から <b>#${front(arr[arr.length-1])}〜#${front(arr[0])}</b>（<b>${arr.length}枚</b>）`;
}

// ============================================================================
// カラーパレット
// ============================================================================

function buildPalette(){
  const p=document.getElementById('palette');
  COLORS.forEach(c=>{
    const wrap=document.createElement('div');
    wrap.className='cb-wrap';
    wrap.dataset.id=c.id;
    const dot=document.createElement('div');
    dot.className='cb'+(c.id===activeColor.id?' on':'');
    dot.style.background=c.hex;
    dot.dataset.id=c.id;
    const nm=document.createElement('div');
    nm.className='color-name'+(c.id===activeColor.id?' on':'');
    nm.textContent=c.name;
    wrap.appendChild(dot); wrap.appendChild(nm);
    wrap.onclick=()=>{
      activeColor=c;
      document.querySelectorAll('.cb').forEach(b=>b.classList.toggle('on',b.dataset.id===c.id));
      document.querySelectorAll('.color-name').forEach(b=>b.classList.toggle('on',b.closest('.cb-wrap')?.dataset.id===c.id));
      if(!selected.size)return;
      saveHistory();
      [...selected].forEach(i=>partColors[i]=c.hex);
      redrawAll(); updateSummary();
    };
    p.appendChild(wrap);
  });
}

async function saveImage(){
  const cv=document.getElementById('save-canvas');

  const sPW=44,sPH=54,sOVL=18,sPAD=6;
  const strapH=sPAD+N*sPH-(N-1)*sOVL+sPAD;
  const ch=56+14+strapH+20+40;
  cv.width=cw*dpr; cv.height=ch*dpr;
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle='#f0ede8'; ctx.fillRect(0,0,cw,ch);
  ctx.fillStyle='#111'; ctx.fillRect(0,0,cw,48);
  ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
  ctx.fillText('708works — FOLKLORE',cw/2,22);
  ctx.font='9px sans-serif'; ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.fillText('COLOR ORDER SIMULATOR',cw/2,38);
  ctx.fillStyle='#444'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
  ctx.fillText('▲ 後ろ（エンドピン側）',cw/2,62);
  const scx=cw/2-22, sy0=70;
  for(let i=0;i<N;i++){
    const y=sy0+sPAD+i*(sPH-sOVL);
    const frontNum=N-i;
    drawDropSave(ctx,scx,y,partColors[i],sPW,sPH,i===0,i===N-1);
    if(frontNum===3){
      const logoColor = isLightColor(partColors[i])
        ? 'rgba(0,0,0,0.25)'
        : 'rgba(255,255,255,0.35)';
      drawLogoMark(ctx, scx, y+sPH*0.55, 0.12, logoColor);
    }
    ctx.fillStyle='#bbb'; ctx.font='7px sans-serif'; ctx.textAlign='right';
    ctx.fillText(`P${frontNum}`,scx+sPW/2+16,y+sPH*.52+3);
    const cname=COLORS.find(c=>c.hex===partColors[i])?.name||'';
    ctx.fillStyle='#333'; ctx.font='10px sans-serif'; ctx.textAlign='left';
    ctx.fillText(cname,scx+sPW/2+20,y+sPH*.52+3);
  }
  const endY=sy0+sPAD+N*sPH-(N-1)*sOVL+sPAD+10;
  ctx.fillStyle='#444'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
  ctx.fillText('▼ 前（ボディ上部側）',cw/2,endY);
  ctx.fillStyle='rgba(0,0,0,.1)'; ctx.fillRect(0,ch-28,cw,28);
  ctx.fillStyle='#888'; ctx.font='9px sans-serif'; ctx.textAlign='center';
  ctx.fillText('shop.708works.jp',cw/2,ch-10);

  const blob = await new Promise(r=>cv.toBlob(r,'image/png'));
  const file = new File([blob],'folklore-color-order.png',{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'FOLKLORE カラーオーダー'});
      return;
    }catch(e){
      if(e.name==='AbortError') return;
    }
  }
  const a=document.createElement('a');
  a.download='folklore-color-order.png';
  a.href=cv.toDataURL('image/png');
  a.click();
  showToast('画像を保存しました');
}

function isLightColor(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000 > 128;
}

function drawDropSave(ctx,cx,y,color,pw,ph,isEndPin,isBodyPin){
  const hw=pw/2,top=y,bot=y+ph;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx,top+1);
  ctx.bezierCurveTo(cx+hw*.55,top+ph*.12,cx+hw,top+ph*.45,cx+hw,bot-hw*.85);
  ctx.bezierCurveTo(cx+hw,bot,cx-hw,bot,cx-hw,bot-hw*.85);
  ctx.bezierCurveTo(cx-hw,top+ph*.45,cx-hw*.55,top+ph*.12,cx,top+1);
  ctx.closePath();
  ctx.fillStyle=color; ctx.fill();
  const g=ctx.createLinearGradient(cx,top,cx,bot);
  g.addColorStop(0,'rgba(255,255,255,.22)'); g.addColorStop(1,'rgba(0,0,0,.15)');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=.8; ctx.stroke();
  if(isEndPin){
    ctx.beginPath(); ctx.arc(cx,top+hw*.52,hw*.30,0,Math.PI*2);
    ctx.fillStyle='#f0ede8'; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1; ctx.stroke();
  }
  if(isBodyPin){
    ctx.beginPath(); ctx.arc(cx,bot-hw*.52,hw*.30,0,Math.PI*2);
    ctx.fillStyle='#f0ede8'; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.restore();
}

async function uploadOrderImage(canvas){
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  const orderId = `folklore-${Date.now()}`;
  
  const formData = new FormData();
  formData.append('image', blob, `${orderId}.png`);
  formData.append('orderId', orderId);
  
  try {
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      body: formData
    });
    
    if (!response.ok) {
      throw new Error(`Upload failed: ${response.status}`);
    }
    
    const data = await response.json();
    
    if (!data.success) {
      throw new Error(data.error || 'Upload failed');
    }
    
    return {
      imageUrl: data.imageUrl,
      orderId: orderId
    };
    
  } catch (error) {
    console.error('Upload error:', error);
    return null;
  }
}

    </p>
  `;
  
  modal.classList.add('show');
}

function closeModal(){
  document.getElementById('confirm-modal').classList.remove('show');
}

function generateColorSummary(){
  const lines = partColors.slice().reverse().map((hex, i) => {
    const name = COLORS.find(c => c.hex === hex)?.name || hex;
    const pos = i === 0 ? ' [前/ボディ上部側]' : i === N - 1 ? ' [後ろ/エンドピン側]' : '';
    return `P${String(i + 1).padStart(2, '0')}${pos}: ${name}`;
  });
  return lines.join('<br>');
}

// ============================================================================
// Shopifyカート追加
// ============================================================================

async function proceedToCart(){
  if (!lastUploadedImage) {
    showToast('画像情報が見つかりません');
    return;
  }
  
  closeModal();
  showLoading('カートに追加中...');
  
  try {
    // カラーデータ作成
    const colorData = partColors.slice().reverse().map((hex, i) => {
      const name = COLORS.find(c => c.hex === hex)?.name || hex;
      const pos = i === 0 ? '[前/ボディ上部側]' : i === N - 1 ? '[後ろ/エンドピン側]' : '';
      return `P${String(i + 1).padStart(2, '0')}${pos}: ${name}`;
    }).join('\n');
    
    const price = PRICE_MAP[N];
    const variantId = VARIANT_MAP[N];
    
    if (!variantId) {
      throw new Error('該当するバリエーションが見つかりません');
    }
    
    // Shopify Cart API
    const cartData = {
      items: [{
        id: variantId,
        quantity: 1,
        properties: {
          '注文ID': lastUploadedImage.orderId,
          'ウロコパーツ数': `${N}個`,
          '全長': `約${1150 + (N - 20) * 60}mm`,
          '価格': `¥${price.toLocaleString()}（税込）`,
          'カラーオーダー': colorData,
          'オーダー画像URL': lastUploadedImage.imageUrl
        }
      }]
    };
    
    const response = await fetch(`https://${SHOPIFY_DOMAIN}/cart/add.js`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(cartData)
    });
    
    if (!response.ok) {
      const errorText = await response.text();
      throw new Error(`カート追加失敗: ${response.status} - ${errorText}`);
    }
    
    hideLoading();
    showToast('カートに追加しました！');
    
    // 2秒後にカートページへリダイレクト
    setTimeout(() => {
      window.location.href = `https://${SHOPIFY_DOMAIN}/cart`;
    }, 1500);
    
  } catch (error) {
    console.error('Cart error:', error);
    hideLoading();
    showToast('カート追加に失敗しました: ' + error.message);
  }
}

</script>
