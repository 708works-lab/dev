name: シミュレーターディスカウント終了処理

on:
  schedule:
    - cron: '0 15 31 7 *'  # 日本時間 8/1 0:00 (UTC 7/31 15:00)
  workflow_dispatch:         # 手動実行も可能

jobs:
  remove-discount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ディスカウントコードを削除
        run: node remove-simulator-discount.js

      - name: 変更をコミット&プッシュ
        run: |
          git config user.name "708works Bot"
          git config user.email "708works@gmail.com"
          git add simulator.js courier-simulator.js
          git diff --staged --quiet || git commit -m "シミュレーターキャンペーン終了：ディスカウント適用を削除"
          git push
